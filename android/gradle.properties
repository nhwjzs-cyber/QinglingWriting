# Gradle 构建 JVM 参数
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true

# AndroidX(docs/03:全部 androidx 依赖)
android.useAndroidX=true

# Kotlin 官方代码风格(docs/05 §2)
kotlin.code.style=official

# AGP 9 内置 Kotlin 默认开启(android.builtInKotlin=true),本工程按官方迁移路径使用;
# 不声明 android.builtInKotlin / android.newDsl 覆盖项,保持 AGP 9 默认行为。

# This workspace uses a Chinese directory name; Java/Kotlin-only builds support this path.
android.overridePathCheck=true
